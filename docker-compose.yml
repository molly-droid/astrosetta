services:
  postgres:
    image: postgres:16-alpine
    container_name: astrosetta-postgres
    environment:
      POSTGRES_DB: astrosetta_dev
      POSTGRES_USER: astro
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astro"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
