# Supabase Configuration File
# This file is used by the Supabase CLI for local development

project_id = "sqdpawyqvgqadflezxxk"

[api]
port = 54341
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54342
major_version = 15

[studio]
port = 54343

[inbucket]
port = 54344
smtp_port = 54345
pop3_port = 54346

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:19006"]  # Expo dev server
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false  # Set to true in production

# Edge Functions
[functions]
# Path to your Edge Functions
# Each function should be in its own directory under supabase/functions/

# Every function verifies auth in-function (user JWT via getAuthUser,
# service key via isServiceRole, or its own token scheme, matching the
# Base44 originals). Gateway JWT verification is off because several
# callers cannot present a user JWT: Stripe webhooks, Google Calendar
# ICS fetches, account-deletion email links, scheduled jobs, and
# function-to-function calls using the (non-JWT) secret API key.
[functions.account-deletion]
verify_jwt = false
